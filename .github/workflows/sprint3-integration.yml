name: Sprint 3 integration checks

on:
  push:
    branches:
      - integration/sprint3-pre-report
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-build:
    name: Build ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore backend/Back_DeliverySystem/Back_DeliverySystem/Back_DeliverySystem.csproj
      - run: dotnet build backend/Back_DeliverySystem/Back_DeliverySystem/Back_DeliverySystem.csproj --configuration Release --no-restore
      - name: Verify EF Core migration snapshot matches code
        env:
          Jwt__Key: "ci-only-test-key-32-plus-chars-please-never-use-in-production"
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.15
          dotnet ef migrations has-pending-model-changes --project backend/Back_DeliverySystem/Back_DeliverySystem/Back_DeliverySystem.csproj --no-build --configuration Release

  web-build:
    name: Build React Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile-check:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
